<!doctype html>
<html class="page" lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/index.css" />

    <link
      rel="shortcut icon"
      href="./icons/dyson-favicon-32x32.svg"
      type="image/x-icon"
    />
    <script defer src="./js/index.js" type="module"></script>
    <title>Dyson</title>
  </head>
  <body class="page__body">
    <header class="header">
      <div class="container header__container">
        <button
          class="header__burger burger"
          aria-label="Открыть меню"
          aria-expanded="false"
          aria-controls="header__menu"
        >
          <svg width="50" height="50">
            <use
              class="burger__icon-menu"
              href="./icons/sprite.svg#burger-menu"
            ></use>
            <use
              class="burger__icon-cross"
              href="./icons/sprite.svg#cross"
            ></use>
          </svg>
        </button>
        <a href="#" class="logo header__logo">
          <img src="./icons/logo-icon.svg" alt="Логотип Dyson" />
        </a>
        <nav class="header__menu" id="header__menu" aria-label="Главное меню">
          <ul class="menu__list">
            <li class="menu__item">
              <a href="#" class="menu__link">О нас</a>
            </li>
            <li class="menu__item">
              <a href="#" class="menu__link">Доставка и оплата</a>
            </li>
            <li class="menu__item">
              <a href="#" class="menu__link">Регистрация продукта</a>
            </li>
            <li class="menu__item">
              <a href="#" class="menu__link">Сервис</a>
            </li>
            <li class="menu__item">
              <a href="#" class="menu__link">Сертификаты и лицензии</a>
            </li>
          </ul>
        </nav>
        <div class="header__action">
          <button class="header__cart-button" aria-label="Корзина">
            <svg width="36" height="36">
              <use
                class="header__cart-icon"
                href="./icons/sprite.svg#cart"
              ></use>
            </svg>
          </button>
        </div>
      </div>
    </header>
    <main class="main">
      <section class="hero">
        <div class="container hero__container">
          <div class="hero__inner">
            <div class="hero__title">
              Уникальные технологии для ухода за волосами
            </div>
            <div class="hero__description">
              Идеальная укладка для всех типов волос вместе с Dyson
            </div>
            <a  class="hero__button" href="#">Подробнее</a>
          </div>
          <picture>
            <source srcset="./images/girl-1-img.webp" />
            <img
              class="hero__img"
              src="./images/girl-1-img.png"
              width="750"
              height="850"
              alt="Девушка укладывает волосы феном Dyson"
            />
          </picture>
        </div>
      </section>
    </main>
  </body>
</html>
